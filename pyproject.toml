[project]
name = "exposure-events-schedule"
version = "1.0.0"
description = "Python client for Exposure Basketball Events API (unauthenticated endpoints)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
browser = [
    "requests-html>=0.10.0",
    "lxml>=5.0.0",
    "lxml-html-clean>=0.4.5",
    "playwright>=1.40.0",
]