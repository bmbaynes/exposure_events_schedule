name: Weekly Tournament Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 4'

permissions:
  contents: read

jobs:
  discover-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update && sudo apt-get install -y chromium
      - run: |
          pip install -e . playwright resend
          playwright install chromium
      - run: |
          python -c "
from exposure_events_schedule import generate_email_itinerary
from datetime import datetime
ref_date = datetime.now()
print(f'Running discovery for weekend of: {ref_date}')
results = generate_email_itinerary(
    reference_date=ref_date,
    team_pattern='Team NSSA*RB/MI*',
    recipient_email='bmbaynes@gmail.com',
    sender_email='Tournament Tracker <tracker@r1.modogt.com>'
)
print(f'Email generated: {results.get("email_generated")}')
print(f'Email sent: {results.get("email_sent")}')
for email in results.get('emails_sent', []):
    print(f'  - {email["event_name"]}: {email["total_games"]} games - Sent: {email["email_sent"]}')
    if email.get('resend_response'):
        print(f'    Resend ID: {email["resend_response"].get("id")}')
if not results.get('email_sent'):
    print('WARNING: No emails were sent!')
    exit(1)
"